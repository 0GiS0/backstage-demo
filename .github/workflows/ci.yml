name: CI

on:
  push:
    branches:
      - microsoft-and-gh

jobs:
  build:   
    defaults:
      runs-on: ubuntu-latest
      working-directory: backstage

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install dependencies
      run: yarn install

    - name: Build project
      run: yarn run build:all

    - name: Run tests
      run: yarn run test:all